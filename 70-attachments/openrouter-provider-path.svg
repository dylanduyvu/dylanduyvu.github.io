<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">The OpenRouter provider path</title>
  <desc id="description">A seven-step path from finding a network gap to proving an edge, launching a public endpoint, applying to OpenRouter, getting listed, earning routed traffic, and reaching profitability.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#68727E"/>
    </marker>
  </defs>

  <rect width="1600" height="640" rx="28" fill="#10151B"/>
  <rect x="1" y="1" width="1598" height="638" rx="27" fill="none" stroke="#29313A" stroke-width="2"/>

  <text x="75" y="60" fill="#63B9AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.6">THE OPENROUTER PROVIDER PATH</text>
  <text x="75" y="116" fill="#F4F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="720" letter-spacing="-1.1">From a network gap to profitable traffic</text>
  <text x="76" y="154" fill="#98A3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22">Each step gives OpenRouter or the market new evidence about the service.</text>

  <line x1="75" y1="216" x2="475" y2="216" stroke="#39434E" stroke-width="2"/>
  <text x="275" y="205" text-anchor="middle" fill="#AAB3BD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">BUILD THE OFFER</text>

  <line x1="495" y1="216" x2="895" y2="216" stroke="#39434E" stroke-width="2"/>
  <text x="695" y="205" text-anchor="middle" fill="#AAB3BD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">LAUNCH + APPLY</text>

  <line x1="915" y1="216" x2="1525" y2="216" stroke="#39434E" stroke-width="2"/>
  <text x="1220" y="205" text-anchor="middle" fill="#AAB3BD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">WIN DISTRIBUTION</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <path d="M267 355 H281" fill="none" stroke="#68727E" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M477 355 H491" fill="none" stroke="#68727E" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M687 355 H701" fill="none" stroke="#68727E" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M897 355 H911" fill="none" stroke="#68727E" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1107 355 H1121" fill="none" stroke="#68727E" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1317 355 H1331" fill="none" stroke="#68727E" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="75" y="246" width="190" height="220" rx="18" fill="#171D24" stroke="#303944" stroke-width="2"/>
      <rect x="95" y="266" width="34" height="34" rx="10" fill="#63B9AF"/>
      <text x="112" y="290" text-anchor="middle" fill="#0F191A" font-size="16" font-weight="800">01</text>
      <text x="95" y="340" fill="#F4F7FA" font-size="24" font-weight="750">FIND A GAP</text>
      <text x="95" y="386" fill="#98A3AF" font-size="18">Demand exists.</text>
      <text x="95" y="413" fill="#98A3AF" font-size="18">Qualified supply</text>
      <text x="95" y="440" fill="#98A3AF" font-size="18">does not.</text>
    </g>

    <g>
      <rect x="285" y="246" width="190" height="220" rx="18" fill="#171D24" stroke="#303944" stroke-width="2"/>
      <rect x="305" y="266" width="34" height="34" rx="10" fill="#63B9AF"/>
      <text x="322" y="290" text-anchor="middle" fill="#0F191A" font-size="16" font-weight="800">02</text>
      <text x="305" y="340" fill="#F4F7FA" font-size="24" font-weight="750">PROVE</text>
      <text x="305" y="370" fill="#F4F7FA" font-size="24" font-weight="750">THE EDGE</text>
      <text x="305" y="413" fill="#98A3AF" font-size="18">Run it on the</text>
      <text x="305" y="440" fill="#98A3AF" font-size="18">planned hardware.</text>
    </g>

    <g>
      <rect x="495" y="246" width="190" height="220" rx="18" fill="#171D24" stroke="#303944" stroke-width="2"/>
      <rect x="515" y="266" width="34" height="34" rx="10" fill="#63B9AF"/>
      <text x="532" y="290" text-anchor="middle" fill="#0F191A" font-size="16" font-weight="800">03</text>
      <text x="515" y="340" fill="#F4F7FA" font-size="23" font-weight="750">OUTREACH</text>
      <text x="515" y="370" fill="#F4F7FA" font-size="23" font-weight="750">+ LAUNCH</text>
      <text x="515" y="413" fill="#98A3AF" font-size="18">Publish the endpoint</text>
      <text x="515" y="440" fill="#98A3AF" font-size="18">and its proof.</text>
    </g>

    <g>
      <rect x="705" y="246" width="190" height="220" rx="18" fill="#171D24" stroke="#303944" stroke-width="2"/>
      <rect x="725" y="266" width="34" height="34" rx="10" fill="#63B9AF"/>
      <text x="742" y="290" text-anchor="middle" fill="#0F191A" font-size="16" font-weight="800">04</text>
      <text x="725" y="340" fill="#F4F7FA" font-size="24" font-weight="750">APPLY</text>
      <text x="725" y="386" fill="#98A3AF" font-size="18">Submit the form,</text>
      <text x="725" y="413" fill="#98A3AF" font-size="18">dashboard, and</text>
      <text x="725" y="440" fill="#98A3AF" font-size="18">test key.</text>
    </g>

    <g>
      <rect x="915" y="246" width="190" height="220" rx="18" fill="#171D24" stroke="#63B9AF" stroke-width="2"/>
      <rect x="935" y="266" width="34" height="34" rx="10" fill="#63B9AF"/>
      <text x="952" y="290" text-anchor="middle" fill="#0F191A" font-size="16" font-weight="800">05</text>
      <text x="935" y="340" fill="#F4F7FA" font-size="24" font-weight="750">GET LISTED</text>
      <text x="935" y="386" fill="#98A3AF" font-size="18">Pass integration</text>
      <text x="935" y="413" fill="#98A3AF" font-size="18">and test traffic.</text>
    </g>

    <g>
      <rect x="1125" y="246" width="190" height="220" rx="18" fill="#171D24" stroke="#303944" stroke-width="2"/>
      <rect x="1145" y="266" width="34" height="34" rx="10" fill="#63B9AF"/>
      <text x="1162" y="290" text-anchor="middle" fill="#0F191A" font-size="16" font-weight="800">06</text>
      <text x="1145" y="340" fill="#F4F7FA" font-size="24" font-weight="750">EARN</text>
      <text x="1145" y="370" fill="#F4F7FA" font-size="24" font-weight="750">TRAFFIC</text>
      <text x="1145" y="413" fill="#98A3AF" font-size="18">Win on price,</text>
      <text x="1145" y="440" fill="#98A3AF" font-size="18">speed, and uptime.</text>
    </g>

    <g>
      <rect x="1335" y="246" width="190" height="220" rx="18" fill="#171D24" stroke="#303944" stroke-width="2"/>
      <rect x="1355" y="266" width="34" height="34" rx="10" fill="#63B9AF"/>
      <text x="1372" y="290" text-anchor="middle" fill="#0F191A" font-size="16" font-weight="800">07</text>
      <text x="1355" y="340" fill="#F4F7FA" font-size="22" font-weight="750">REACH</text>
      <text x="1355" y="370" fill="#F4F7FA" font-size="20" font-weight="750">PROFITABILITY</text>
      <text x="1355" y="413" fill="#98A3AF" font-size="18">Turn routed demand</text>
      <text x="1355" y="440" fill="#98A3AF" font-size="18">into margin.</text>
    </g>
  </g>

  <line x1="75" y1="516" x2="1525" y2="516" stroke="#29313A" stroke-width="2"/>
  <circle cx="88" cy="568" r="7" fill="#63B9AF"/>
  <text x="112" y="576" fill="#F4F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700">LISTING IS ONE GATE.</text>
  <text x="345" y="576" fill="#98A3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21">Traffic and profit still depend on routing, reliability, and unit economics.</text>
</svg>
